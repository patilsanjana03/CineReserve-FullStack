<div class="container my-5">
  <h3 class="fw-bold mb-4">
    <i class="fas fa-ticket-alt text-warning me-2"></i>My Bookings History
  </h3>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-warning"></div>
  </div>

  <div *ngIf="!loading && bookings.length === 0" class="text-center py-5">
    <i class="fas fa-film fa-3x text-muted mb-3 d-block"></i>
    <p class="text-muted">No bookings found yet. Own your first theater experience today!</p>
  </div>

  <div class="row g-3" *ngIf="!loading && bookings.length > 0">
    <div class="col-md-6" *ngFor="let b of bookings">
      <div class="card border-0 shadow-sm p-3" style="border-left: 4px solid #FFD700; border-radius:12px;">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h6 class="fw-bold mb-1">{{ b.movieTitle }}</h6>
            <small class="text-muted">{{ b.showDate | date:'EEE, MMM d, yyyy' }} at {{ b.showTime }}</small><br>
            <small class="text-muted"><i class="fas fa-door-open me-1"></i>{{ b.hallName }}</small>
          </div>
          <span class="badge bg-success">Confirmed</span>
        </div>
        <hr class="my-2">
        <div class="d-flex justify-content-between">
          <div>
            <small class="text-muted">Allocated Seats: </small>
            <span *ngFor="let s of b.seats" class="badge bg-warning text-dark me-1">{{ s }}</span>
          </div>
          <strong class="text-success">₹{{ b.totalPaid }}</strong>
        </div>
        <small class="text-muted mt-1 d-block">Booking Ref: <strong>{{ b.bookingRef }}</strong></small>
      </div>
    </div>
  </div>
</div>
