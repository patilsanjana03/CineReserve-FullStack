<nav class="navbar navbar-expand-lg" style="background-color: #0d0d2b;">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4 text-warning" routerLink="/">
      <i class="fas fa-film me-2"></i>CineReserve
    </a>
    
    <button class="navbar-toggler text-white border-light" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/" routerLinkActive="text-warning"
             [routerLinkActiveOptions]="{exact:true}">
            <i class="fas fa-home me-1"></i>Movies
          </a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn">
          <a class="nav-link text-white" routerLink="/my-bookings" routerLinkActive="text-warning">
            <i class="fas fa-ticket-alt me-1"></i>My Bookings
          </a>
        </li>
      </ul>
      
      <ul class="navbar-nav align-items-center">
        <ng-container *ngIf="isLoggedIn">
          <li class="nav-item me-3" *ngIf="isAdmin">
            <span class="badge bg-danger text-white px-2 py-1.5 fw-bold shadow-sm" style="border: 1px solid rgba(255,255,255,0.2);">
              <i class="fas fa-shield-alt me-1"></i>Admin Portal
            </span>
          </li>
          
          <li class="nav-item me-3">
            <span class="text-warning small fw-bold">
              <i class="fas fa-wallet me-1"></i>₹{{ balance | number:'1.0-0' }}
            </span>
          </li>
          
          <li class="nav-item me-3">
            <span class="text-light small">
              <i class="fas fa-user me-1"></i>{{ username }}
            </span>
          </li>
          
          <li class="nav-item">
            <button class="btn btn-sm btn-outline-warning" (click)="logout()">
              <i class="fas fa-sign-out-alt"></i> Logout
            </button>
          </li>
        </ng-container>
        
        <ng-container *ngIf="!isLoggedIn">
          <li class="nav-item me-2">
            <a class="btn btn-sm btn-outline-light" routerLink="/login">Login</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-sm btn-warning text-dark fw-bold" routerLink="/register">Register</a>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
